[package]
name = "prin-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
num-traits = "0.2"
rayon = "1"
png = "0.17"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "svg_backend", "ttf", "line_series", "point_series"] }
gif = "0.14.2"
color_quant = "2.0.0"

[profile.release]
opt-level = 3
lto = true
